name = "pixai-platform"
main = "server/worker.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "pixai"
database_id = "6c04f7a5-be9e-4169-9ac0-0596f4df380c"
migrations_dir = "drizzle"

[observability]
enabled = true

[vars]
APP_ENV = "production"
PUBLIC_BASE_URL = "https://pixai-platform.pixai-oficial.workers.dev"
ASAAS_ENV = "sandbox"
PAYMENTS_ENABLED = "false"
INFINITEPAY_HANDLE = "lucas-banza"
INFINITEPAY_ENABLED = "true"
INFINITEPAY_TEST_MODE = "false"
INFINITEPAY_MIN_AMOUNT_CENTS = "2000"
INFINITEPAY_MAX_AMOUNT_CENTS = "25000"
INFINITEPAY_GATEWAY_RATE_PPM = "155000"
INFINITEPAY_MIN_MARGIN_PPM = "300000"
