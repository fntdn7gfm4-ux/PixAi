<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1954ed" />
    <meta
      name="description"
      content="Administração dos pagamentos de serviços processados pela InfinitePay."
    />
    <title>PixAI — Administração</title><meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body data-admin="true">
    <a class="skip" href="#main">Pular para o conteúdo</a>
    <div class="sandbox-bar" id="env-bar">
      <span class="status-dot"></span><strong>PixAI</strong><span>Verificando disponibilidade…</span>
    </div>
    <header class="header">
      <a class="brand" href="./#home" aria-label="Pixaí início"
        ><span class="official-logo"
          ><img
            src="./assets/pixai-logo-oficial.png"
            alt="PixAI"
            width="1254"
            height="1254" /></span
      ></a>
      <nav aria-label="Principal">
        <a href="./#home">Pagar serviço</a><a href="./#terms">Termos</a>
      </nav>
      <span class="header-tag">Checkout InfinitePay</span>
    </header>
    <main id="main" tabindex="-1">
      <div class="loading" role="status">Preparando suas opções…</div>
    </main>
    <div id="notification" role="alert" aria-live="assertive"></div>
    <footer>
      <a class="brand small" href="./#home" aria-label="PixAI início"
        ><span class="official-logo"
          ><img
            src="./assets/pixai-logo-oficial.png"
            alt="PixAI"
            width="1254"
            height="1254" /></span></a
      ><span>Clareza em cada etapa.</span>
      <nav aria-label="Rodapé">
        <a href="./#privacy">Privacidade</a><a href="./#terms">Termos de uso</a
        ><a href="./admin.html">Administração</a>
      </nav>
      <p>
        Pagamentos processados no checkout seguro da InfinitePay.
      </p>
    </footer>
  </body>
</html>
